apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bus-passenger-controller
rules:
  - apiGroups: ["demo.sync"]
    resources: ["bussimulations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["demo.sync"]
    resources: ["bussimulations/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bus-passenger-controller
subjects:
  - kind: ServiceAccount
    name: bus-passenger-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bus-passenger-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bus-passenger-ui
rules:
  - apiGroups: ["demo.sync"]
    resources: ["bussimulations"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bus-passenger-ui
subjects:
  - kind: ServiceAccount
    name: bus-passenger-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bus-passenger-ui
